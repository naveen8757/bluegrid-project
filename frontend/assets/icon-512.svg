<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063B70"/>
      <stop offset="50%" stop-color="#087DB5"/>
      <stop offset="100%" stop-color="#16C7D9"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F77F00"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16C7D9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EEF6FB" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Outer Energy Grid Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#16C7D9" stroke-width="4" stroke-dasharray="10 8" opacity="0.45"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

  <!-- Sun Symbol (Solar) -->
  <circle cx="256" cy="140" r="32" fill="url(#sun)" filter="url(#glow)"/>

  <!-- Stylized Wind Turbine Blades -->
  <path d="M160 256 L180 250 L180 262 Z" fill="#FFFFFF" opacity="0.9"/>
  <line x1="180" y1="256" x2="256" y2="256" stroke="#16C7D9" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Central Glowing Smart Grid Node -->
  <circle cx="256" cy="256" r="42" fill="#082B45" stroke="#16C7D9" stroke-width="5" filter="url(#glow)"/>
  <polygon points="256,230 274,260 238,260" fill="#16C7D9"/>
  <rect x="251" y="264" width="10" height="14" rx="2" fill="#FFD166"/>

  <!-- Ocean Waves (OTEC & Marine) -->
  <path d="M90 350 Q 170 320 256 350 T 422 350 L 422 410 Q 340 430 256 405 T 90 410 Z" fill="url(#wave)" opacity="0.85"/>
  <path d="M120 380 Q 200 355 256 375 T 392 375 L 392 415 Q 310 435 256 415 T 120 420 Z" fill="#EEF6FB" opacity="0.95"/>
</svg>
